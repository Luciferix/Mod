# Prints decompiled Minecraft classes into the job log, for development sessions
# whose sandbox can't download Minecraft. Run it manually from the Actions tab.

name: mc-source-dump
on:
  workflow_dispatch:
    inputs:
      classes:
        description: "Space-separated class paths to print, e.g. net/minecraft/world/item/FishingRodItem"
        required: false
        default: ""
      mode:
        description: "source (decompiled code) or javap (member signatures only)"
        required: false
        default: "source"
      grep:
        description: "Optional extended regex to search for across all Minecraft sources"
        required: false
        default: ""
      files:
        description: "Space-separated resource paths or globs from the Minecraft jars, e.g. data/minecraft/trade_set/*"
        required: false
        default: ""

jobs:
  dump:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: decompile minecraft
        run: chmod +x ./gradlew && ./gradlew genSources --no-configuration-cache -q
      - name: dump
        env:
          CLASSES: ${{ inputs.classes }}
          MODE: ${{ inputs.mode }}
          PATTERN: ${{ inputs.grep }}
          FILES: ${{ inputs.files }}
        run: |
          mkdir -p /tmp/mc-src /tmp/mc-res
          find ~/.gradle .gradle -name 'minecraft-*sources.jar' 2>/dev/null | while read -r jar; do unzip -qo "$jar" -d /tmp/mc-src; done
          CP=$(find ~/.gradle .gradle -name 'minecraft-*.jar' ! -name '*sources*' 2>/dev/null | tr '\n' ':')
          for jar in ${CP//:/ }; do unzip -qo "$jar" 'data/*' 'assets/*' -d /tmp/mc-res 2>/dev/null || true; done
          for p in $FILES; do
            for m in /tmp/mc-res/$p; do
              if [ -d "$m" ]; then
                echo "##### DIR: ${m#/tmp/mc-res/}"
                find "$m" | sed 's#/tmp/mc-res/##' | sort | head -n 300
              else
                echo "##### FILE: ${m#/tmp/mc-res/}"
                cat "$m" 2>/dev/null || echo "(not found)"
                echo
              fi
            done
          done
          if [ -n "$PATTERN" ]; then
            echo "##### GREP: $PATTERN"
            grep -rnE "$PATTERN" /tmp/mc-src --include=*.java | sed 's#/tmp/mc-src/##' | head -n 400
          fi
          for c in $CLASSES; do
            echo "##### CLASS: $c"
            if [ "$MODE" = "javap" ]; then
              javap -p -cp "$CP" "${c//\//.}" || echo "(not found)"
            else
              cat "/tmp/mc-src/$c.java" || echo "(not found)"
            fi
          done
          echo "##### END"
